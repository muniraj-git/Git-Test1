apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: muni-replicaset
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: muni-pod
      labels:
        app: myapp
    spec:
      containers:
        - name: muni-container
          image: nginx:latest
          ports:
            - containerPort: 80
  